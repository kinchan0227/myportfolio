<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="せいかへのお問い合わせはこちらから。" />
    <title>お問い合わせ | my portfolio</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Serif+JP:wght@400;500;700&family=Zen+Maru+Gothic&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a class="logo" href="./index.html" aria-label="seika. トップページ">
          seika<span>.</span>
        </a>
        <nav class="header__nav" id="site-navigation" aria-label="メインナビゲーション">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="./index.html#about">わたしについて</a>
            </li>
            <li class="header__nav-item">
              <a href="./index.html#works">制作実績</a>
            </li>
            <li class="header__nav-item">
              <a href="./index.html#skills">できること</a>
            </li>
            <li class="header__nav-item">
              <a href="./index.html#flow">ご依頼の流れ</a>
            </li>
            <li class="header__nav-item header__nav-item--contact">
              <a href="./contact.html">お問い合わせ</a>
            </li>
          </ul>
        </nav>
        <a class="header__contact-btn" href="mailto:car227na@gmail.com">
          メールで問い合わせ
        </a>
        <button
          class="header__menu-toggle"
          type="button"
          aria-label="メニューを開く"
          aria-controls="site-navigation"
          aria-expanded="false"
          data-menu-toggle
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>
    <main>
      <section class="contact-page" aria-labelledby="contact-page-title">
        <div class="contact-page__inner">
          <div class="contact-page__hero">
            <div class="contact-page__heading">
              <p class="contact-page__kicker">Contact</p>
              <h1 class="contact-page__title" id="contact-page-title">
                お問い合わせ
              </h1>
            </div>
            <img
              class="contact-page__photo"
              src="./img/%20contact.jpg"
              alt="花柄の赤いポスト"
              width="2000"
              height="1333"
            />
          </div>
          <p class="contact-page__description">
            Webサイト制作のご依頼や、コーディングに関するご相談など、どうぞお気軽にご連絡ください。まだ内容がまとまっていない段階でも大丈夫です。
          </p>
          <form
            class="contact-form"
            id="contact-form"
            action="mailto:car227na@gmail.com"
            method="post"
            enctype="text/plain"
          >
            <div class="contact-form__field">
              <label class="contact-form__label" for="contact-name">
                氏名 <span>必須</span>
              </label>
              <input
                class="contact-form__input"
                id="contact-name"
                name="name"
                type="text"
                autocomplete="name"
                required
              />
            </div>
            <div class="contact-form__field">
              <label class="contact-form__label" for="contact-email">
                メールアドレス <span>必須</span>
              </label>
              <input
                class="contact-form__input"
                id="contact-email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="contact-form__field">
              <label class="contact-form__label" for="contact-message">
                お問い合わせ内容 <span>必須</span>
              </label>
              <textarea
                class="contact-form__input contact-form__textarea"
                id="contact-message"
                name="message"
                rows="7"
                required
              ></textarea>
            </div>
            <div class="contact-form__consent">
              <input
                id="contact-privacy"
                name="privacy"
                type="checkbox"
                required
              />
              <label for="contact-privacy">プライバシーポリシーに同意する</label>
            </div>
            <button class="contact-form__submit" type="submit">
              <span>送信する</span>
            </button>
          </form>
          <a class="contact-page__back" href="./index.html">← トップページへ戻る</a>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer__inner">
        <a class="logo" href="./index.html" aria-label="seika. トップページ">
          seika<span>.</span>
        </a>
        <p class="footer__message">想いに寄り添い、丁寧にカタチに。</p>
        <small class="footer__copyright">© <span data-current-year></span> seika design</small>
      </div>
    </footer>
    <script src="./js/script.js" defer></script>
  </body>
</html>
